<title id="t">Croquis de la pièce aux six cercles</title><desc id="d">Deux faces d'une pièce ancienne. Une face porte un arbre sans feuilles. L'autre montre six cercles autour d'un cercle central. Un cercle extérieur est plus profond et une entaille au centre pointe vers lui.</desc>
