<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
<title id="t">Plan ancien du quartier des Relieurs</title><desc id="d">Plan sur parchemin montrant trois voies, un atelier de serrurerie, une maison condamnée et la ruelle recherchée.</desc>
<defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#ead9ae"/><stop offset="1" stop-color="#b99a67"/></linearGradient><pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".8" fill="#705334" opacity=".18"/><circle cx="13" cy="12" r=".6" fill="#705334" opacity=".15"/></pattern></defs>
<rect x="12" y="12" width="876" height="536" rx="12" fill="url(#paper)" stroke="#4d3924" stroke-width="8"/><rect x="28" y="28" width="844" height="504" rx="6" fill="url(#grain)" stroke="#876b43" stroke-width="2"/>
<text x="450" y="66" text-anchor="middle" font-family="Georgia" font-size="29" fill="#382817" letter-spacing="3">PLAN DU VIEUX QUARTIER</text>
<path d="M80 150 H820 M80 280 H820 M80 420 H820" stroke="#6b5639" stroke-width="3" stroke-dasharray="10 8" opacity=".55"/>
<path d="M130 105 L130 480 M450 105 L450 480 M760 105 L760 480" stroke="#6b5639" stroke-width="3" stroke-dasharray="10 8" opacity=".55"/>
<!-- voies -->
<path d="M70 170 C220 170 260 150 430 170 S680 170 830 170" fill="none" stroke="#f5e8c8" stroke-width="42"/><path d="M70 170 C220 170 260 150 430 170 S680 170 830 170" fill="none" stroke="#806744" stroke-width="2"/>
<path d="M130 100 L130 480" stroke="#f5e8c8" stroke-width="38"/><path d="M130 100 L130 480" stroke="#806744" stroke-width="2"/>
<path d="M450 100 L450 480" stroke="#f5e8c8" stroke-width="38"/><path d="M450 100 L450 480" stroke="#806744" stroke-width="2"/>
<path d="M760 100 L760 480" stroke="#f5e8c8" stroke-width="38"/><path d="M760 100 L760 480" stroke="#806744" stroke-width="2"/>
<text x="245" y="145" font-family="Georgia" font-size="20" fill="#3f2d1b">RUE DU PONT</text><text x="148" y="330" transform="rotate(-90 148 330)" font-family="Georgia" font-size="18" fill="#3f2d1b">VENELLE DES TANNEURS</text><text x="468" y="330" transform="rotate(-90 468 330)" font-family="Georgia" font-size="20" font-weight="bold" fill="#3f2d1b">RUELLE DES RELIEURS</text>
<!-- atelier -->
<rect x="520" y="215" width="175" height="92" rx="5" fill="#8d7653" stroke="#3e2b19" stroke-width="4"/><path d="M520 245 L607 190 L695 245" fill="#705638" stroke="#3e2b19" stroke-width="4"/><text x="607" y="270" text-anchor="middle" font-family="Georgia" font-size="17" fill="#fff0cf">ATELIER DE</text><text x="607" y="291" text-anchor="middle" font-family="Georgia" font-size="17" fill="#fff0cf">SERRURERIE</text>
<!-- maison condamnée -->
<rect x="520" y="340" width="175" height="100" rx="4" fill="#79694e" stroke="#3e2b19" stroke-width="4"/><path d="M520 368 L607 315 L695 368" fill="#62523d" stroke="#3e2b19" stroke-width="4"/><path d="M550 380 l30 30 m0 -30 l-30 30 M625 380 l30 30 m0 -30 l-30 30" stroke="#30251a" stroke-width="7"/><text x="607" y="430" text-anchor="middle" font-family="Georgia" font-size="16" fill="#fff0cf">MAISON MURÉE</text>
<path d="M450 310 Q500 330 520 350" fill="none" stroke="#a33c27" stroke-width="5" stroke-dasharray="7 7"/><circle cx="450" cy="280" r="12" fill="#a33c27" stroke="#f8e8c9" stroke-width="4"/><text x="450" y="500" text-anchor="middle" font-family="Georgia" font-size="18" fill="#4b351f">La voie se trouve entre les deux bâtiments signalés.</text>
<g transform="translate(790 95)"><path d="M0 45 L15 0 L30 45 L15 36Z" fill="#4d3924"/><text x="15" y="65" text-anchor="middle" font-family="Georgia" font-size="17" fill="#4d3924">N</text></g>
</svg>
