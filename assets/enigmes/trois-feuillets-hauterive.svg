<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">Les trois feuillets des archives de Hauterive</title><desc id="d">Trois documents d'archives avec les titres Serment des Couronnes, Fermeture du Col, Départ des Navigateurs et les dates des années 214, 267 et 311. Les revers et fragments de lettres ne sont pas visibles.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#152231"/><stop offset="1" stop-color="#080e17"/></linearGradient><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#ead9b1"/><stop offset="1" stop-color="#b99c69"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter></defs>
<rect x="8" y="8" width="1184" height="484" rx="22" fill="url(#bg)" stroke="#b9975b" stroke-width="3"/>
<g font-family="Georgia,serif" fill="#392719">
<g transform="translate(55 55) rotate(-2 165 180)"><rect x="8" y="10" width="310" height="370" rx="8" fill="#000" opacity=".3" filter="url(#shadow)"/><path d="M0 0H300L320 22V360L300 380H0Z" fill="url(#paper)" stroke="#6b4c2c" stroke-width="5"/><path d="M20 25H280M20 340H280" stroke="#896b42" stroke-width="2"/><text x="150" y="72" text-anchor="middle" font-size="17" letter-spacing="3">ARCHIVES · FEUILLET I</text><text x="150" y="135" text-anchor="middle" font-size="23" font-weight="bold">Le Serment des</text><text x="150" y="165" text-anchor="middle" font-size="23" font-weight="bold">Couronnes</text><path d="M65 205H255M65 225H255M65 245H235" stroke="#81633e" stroke-width="3" opacity=".65"/><text x="150" y="300" text-anchor="middle" font-size="18">12e jour · Semences</text><text x="150" y="330" text-anchor="middle" font-size="26" font-weight="bold">ANNÉE 214</text></g>
<g transform="translate(445 55) rotate(1 165 180)"><rect x="8" y="10" width="310" height="370" rx="8" fill="#000" opacity=".3" filter="url(#shadow)"/><path d="M0 0H300L320 22V360L300 380H0Z" fill="url(#paper)" stroke="#6b4c2c" stroke-width="5"/><path d="M20 25H280M20 340H280" stroke="#896b42" stroke-width="2"/><text x="150" y="72" text-anchor="middle" font-size="17" letter-spacing="3">ARCHIVES · FEUILLET II</text><text x="150" y="135" text-anchor="middle" font-size="23" font-weight="bold">La Fermeture</text><text x="150" y="165" text-anchor="middle" font-size="23" font-weight="bold">du Col</text><path d="M65 205H255M65 225H255M65 245H235" stroke="#81633e" stroke-width="3" opacity=".65"/><text x="150" y="300" text-anchor="middle" font-size="18">3e jour · Brumes</text><text x="150" y="330" text-anchor="middle" font-size="26" font-weight="bold">ANNÉE 267</text></g>
<g transform="translate(835 55) rotate(-1 165 180)"><rect x="8" y="10" width="310" height="370" rx="8" fill="#000" opacity=".3" filter="url(#shadow)"/><path d="M0 0H300L320 22V360L300 380H0Z" fill="url(#paper)" stroke="#6b4c2c" stroke-width="5"/><path d="M20 25H280M20 340H280" stroke="#896b42" stroke-width="2"/><text x="150" y="72" text-anchor="middle" font-size="17" letter-spacing="3">ARCHIVES · FEUILLET III</text><text x="150" y="135" text-anchor="middle" font-size="23" font-weight="bold">Le Départ des</text><text x="150" y="165" text-anchor="middle" font-size="23" font-weight="bold">Navigateurs</text><path d="M65 205H255M65 225H255M65 245H235" stroke="#81633e" stroke-width="3" opacity=".65"/><text x="150" y="300" text-anchor="middle" font-size="18">19e jour · Marées</text><text x="150" y="330" text-anchor="middle" font-size="26" font-weight="bold">ANNÉE 311</text></g>
</g><text x="600" y="463" text-anchor="middle" fill="#e7d5ae" font-family="Georgia,serif" font-size="20">Les dates sont visibles. Les marques au revers attendent le bon classement.</text>
</svg>