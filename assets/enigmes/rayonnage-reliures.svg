<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Trois reliures sur un rayonnage ancien</title><desc id="d">Trois livres fermés portant respectivement une couronne, une montagne et une vague, placés dans le désordre.</desc>
