<style>
.fiche-page{width:min(940px,calc(100% - 28px));margin:38px auto 70px}
.fiche-shell{background:linear-gradient(145deg,rgba(19,31,48,.97),rgba(7,13,24,.98));border:1px solid rgba(194,157,91,.38);border-radius:18px;padding:clamp(18px,4vw,42px);box-shadow:0 22px 70px rgba(0,0,0,.38)}
.fiche-back{display:inline-flex;align-items:center;gap:8px;color:#d8bd85;text-decoration:none;font:600 12px Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-bottom:26px}
.fiche-kicker,.fiche-section-label{color:#8fc8d7;font:600 11px Manrope,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.fiche-title{font:600 clamp(28px,5vw,48px) Cinzel,serif;color:#f1e4c7;line-height:1.2;margin:12px 0 26px}
.fiche-hero{border:1px solid rgba(194,157,91,.45);border-radius:14px;overflow:hidden;background:#080d18}
.fiche-hero img{display:block;width:100%;max-height:590px;object-fit:cover}
.fiche-video-section,.fiche-story{margin-top:34px;padding-top:26px;border-top:1px solid rgba(194,157,91,.2)}
.fiche-video{display:block;width:100%;max-height:440px;margin-top:16px;border-radius:12px;background:#02050a}
.fiche-video-note{color:#9ba8b8;font:13px Manrope,sans-serif;margin-top:12px}
.fiche-description{color:#e0dfda;font:16px/1.9 Manrope,sans-serif;margin:18px 0}
.fiche-story blockquote{margin:22px 0;padding:18px 22px;border-left:3px solid #b99a60;background:rgba(185,154,96,.08);color:#e7d2a6;font:italic 18px/1.7 Cinzel,serif}
.fiche-origin{color:#aab5c3;font:13px Manrope,sans-serif;margin-top:24px}
.fiche-back-bottom{margin:34px 0 0}
.fiche-unavailable{text-align:center;padding:70px 20px}
.fiche-unavailable h1{font:600 30px Cinzel,serif;color:#f1e4c7}
.fiche-unavailable p{color:#c3cad2;font:15px/1.7 Manrope,sans-serif}
@media(max-width:600px){.fiche-page{margin:18px auto 42px}.fiche-shell{padding:18px}.fiche-title{margin-bottom:18px}.fiche-description{font-size:14px}}
</style>

<style>
.site-header{position:sticky;top:0;z-index:100;background:rgba(7,12,22,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(210,178,119,.24)}
.site-header .nav{max-width:1200px;margin:auto;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.site-header .brand{font:600 17px Cinzel,Georgia,serif;letter-spacing:3px;color:#f2dfb8;white-space:nowrap}
.site-header nav{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
.site-header nav a{display:flex;align-items:center;min-height:38px;padding:0 13px;color:#d9d4ca;font:700 10px Manrope,sans-serif;letter-spacing:1.6px}
.site-header nav a:hover{color:#82dff1}
@media(max-width:760px){.site-header .nav{padding:10px 12px;flex-direction:column;gap:7px}.site-header .brand{font-size:16px}.site-header nav{width:100%;gap:0;padding-top:5px}.site-header nav a{min-height:34px;padding:0 9px;font-size:9px;letter-spacing:1px}}
</style>

 .site-header nav{width:100%;margin:0;justify-content:center;border-top:1px solid rgba(210,178,119,.12);padding-top:4px}
}
